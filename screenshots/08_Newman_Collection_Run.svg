    <circle cx="20" cy="22" r="6" fill="#ED6A5E"/>
    <circle cx="38" cy="22" r="6" fill="#F4BE4F"/>
    <circle cx="56" cy="22" r="6" fill="#61C554"/>
    <text x="450" y="27" class="font-ui" font-size="13" font-weight="600" fill="#A0A0A5" text-anchor="middle">Postman - 8. Postman Newman CLI - 22/22 Assertions Passed</text>

