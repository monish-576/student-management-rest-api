# ===================================================================
# Student Management REST API - Application Configuration
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=StudentManagement

# ===================================================================
# MySQL Database Configuration
# Uses environment variables with sensible local defaults
# To override: set DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:student_management_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

